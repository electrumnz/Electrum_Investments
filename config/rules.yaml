# Trading rules — the bot CANNOT violate these. Claude proposes, risk.py gates.
#
# Every number here is enforced in deterministic Python, not by asking the model
# nicely. If you want different behaviour, change it here — do not try to talk
# the agent into it, because it cannot comply.
#
# Structure must stay the same so src/bot/config.py can parse it; the numbers
# are yours to tune.

account:
  # If equity drops below this, the bot halts entirely.
  # Set for Alpaca's default $100,000 paper balance — a 10% drawdown floor.
  # If you reset the paper account to a different balance, change this to match.
  min_equity_floor_usd: 90000

  # --- The two that matter -------------------------------------------------
  # Both are RISK limits: what would actually be lost if stops fill. That makes
  # them leverage-neutral — the same numbers mean the same thing on cash
  # equities, on margin, on options, or on futures if a broker is ever added.

  # Max loss on a single trade, as % of equity. A wider stop means a SMALLER
  # position, not more risk.
  max_risk_per_trade_pct: 1.0

  # Max combined loss if every open stop filled at once, as % of equity.
  # At 1% per trade this allows two full-size trades, or four half-size ones.
  max_total_risk_pct: 2.0

  # --- Sanity checks, not the binding constraint ---------------------------

  # Concentration cap on a single position's market value, as % of equity.
  # Deliberately generous: a 1%-risk trade with a 2% stop implies a position
  # worth ~50% of equity, so a tight cap here would silently become the real
  # limit and quietly override the risk rules above.
  max_position_pct: 50.0

  # Max simultaneous open positions across all symbols.
  max_concurrent_positions: 3

  # Daily loss kill-switch: once the day is down this much from starting equity,
  # no new positions open until the next session. Sticky — a recovery within the
  # same day does not re-enable trading.
  daily_loss_kill_pct: 3.0

# Anti-churn limits. Fees, not stock picking, were the dominant loss driver in
# the Alpha Arena LLM trading competition — the model that made 238 trades lost
# 57% of its stake. Treat these as risk controls.
frequency:
  max_trades_per_day: 5
  max_trades_per_week: 15
  # Cooldown before re-trading the same symbol. Prevents flip-flopping.
  min_seconds_between_trades_per_symbol: 1800   # 30 minutes

# Consecutive-loss circuit breaker. A losing run is when discipline is weakest
# and sizing gets worst, so this interrupts the loop rather than trying to
# predict the next trade.
#
# During a stand-down: LIVE trading is suspended, PAPER trading continues
# exactly as normal. The money stops, the practice does not — staying in the
# market on paper is the point. Closing positions and moving stops are never
# blocked, in any mode.
stand_down:
  # Losses in a row before the breaker trips.
  consecutive_losses_trigger: 3

  # A loss smaller than this many R is a scratch: it neither counts toward the
  # streak nor resets it. Without this, cutting a trade for a few dollars would
  # count against you, which would push the bot toward holding losers.
  loss_threshold_r: 0.25

  # First trip.
  stage_one_days: 3

  # A second trip inside repeat_window_days looks like a pattern rather than
  # variance, so it costs more.
  stage_two_days: 10
  repeat_window_days: 30

# Margin guards.
#
# These replace the Pattern Day Trader rule, which FINRA RETIRED on 2026-06-04
# (Regulatory Notice 26-10). The $25,000 threshold is gone: 4x intraday buying
# power now needs only $2,000 equity, and Alpaca removed daytrade_count and
# pattern_day_trader from its API on 2026-07-06.
#
# What replaced it is Intraday Margin Deficit calls — Alpaca rejects orders that
# would create a deficit in real time, and repeated non-compliance inside five
# business days still costs a 90-day account restriction. So the reasoning is
# unchanged, just pointed at the rule that actually applies now: leave headroom,
# because finding the edge is far more expensive than skipping a trade.
margin:
  # Share of available buying power a single order may consume.
  max_buying_power_utilisation_pct: 50.0

  # Total market exposure as % of equity. Reg T permits 200% overnight
  # (2:1 leverage); this leaves headroom against it.
  max_gross_notional_pct: 150.0

# Option expiry safety.
#
# The bot does not propose option trades — that is deferred work. These rules
# exist to make sure a contract never expires unnoticed, because Alpaca acts
# automatically and irreversibly at expiry:
#
#   - in the money by $0.01 or more  -> AUTO-EXERCISED by 6pm ET on expiry day
#   - ITM but you cannot fund it     -> LIQUIDATED inside the final hour
#   - short and ITM                  -> AUTO-ASSIGNED after the close
#   - "Do Not Exercise"              -> CANNOT be filed through the API
#
# Because DNE is not automatable, closing the position yourself is the only way
# to choose a different outcome. Hence warning early and loudly.
options:
  # Start warning this many days out — enough time to plan an exit.
  warn_days_before_expiry: 7.0

  # Refuse to OPEN an option position closer than this to expiry.
  min_days_to_expiry_for_entry: 3.0

  # Inside this many days, warnings are marked as requiring action.
  escalate_to_action_days: 1.0

# Don't open new positions in the N minutes around high-impact news.
# Applies across every instrument class.
news_blackout_minutes_before: 15
news_blackout_minutes_after: 15

# Accounts whose posts move prices before the wire story lands.
#
# CONTEXT ONLY. These reach Claude's prompt and nothing else; the risk gate
# never sees them. A blackout window after a high-impact post would be a change
# to what the gate refuses, and that belongs in its own commit with a test.
#
# Reading timelines needs a paid X tier and X_BEARER_TOKEN in .env. Without the
# token this block is inert, whatever it says here.
social:
  enabled: false

  accounts:
    - realDonaldTrump    # tariffs, named companies, Fed commentary
    - federalreserve
    - SecScottBessent

  # How far back to look each cycle. Longer than one cycle so a post is not
  # missed when the loop restarts or a cycle runs long.
  lookback_minutes: 90

  # One line each in the prompt. More than this and a busy account crowds out
  # the market data it is meant to be read beside.
  max_posts: 12

# Instruments. Each asset class carries its own session window, symbol list and
# strategy, because they genuinely differ: equities trade a fixed window, crypto
# trades continuously. Holding both under one global session setting meant
# enabling crypto silently forbade trading it for three quarters of the day.
#
# Account-level rules above (1% per trade, 2% total risk, stand-down, daily loss,
# margin) stay portfolio-wide and apply across every class.
# How the loop spends its time and money. NOT risk rules: nothing here reaches
# the risk gate, and the worst a wrong value can do is stop the model being
# asked. It can never widen what the model is allowed to answer.
loop:

  # Skip the model call on a cycle where no enabled instrument class is in
  # session. Reconcile, the stand-down state and the option expiry alerts still
  # run every single cycle — only the proposal is skipped.
  #
  # The loop wakes 96 times a day. US equities are open for 32.5 hours of the
  # 168 in a week, so with equities alone about 80% of those cycles pay for a
  # decision that the session gate will refuse whatever it says. Observed: a
  # Sunday-night AAPL proposal, rejected on the day rule, having cost a full
  # call to produce.
  #
  # The window is DERIVED from the instruments block below, never a copy of it.
  # Enabling a 24/7 class makes this a no-op on its own, because that class is
  # always in session — so this cannot silently switch the bot off when the
  # instrument mix grows.
  skip_model_call_when_all_markets_closed: true

instruments:

  us_equity:
    enabled: true

    # Label recorded on every trade so metrics can tell strategies apart, and
    # injected into Claude's system prompt. Defining what it actually means is
    # the operator's job and is the genuinely hard part.
    strategy: mean_reversion

    # Liquid, heavily covered US large caps and index ETFs. ETFs are the same
    # asset class as equities at Alpaca, so they need no separate entry.
    allowed_symbols:
      - SPY
      - QQQ
      - AAPL
      - MSFT
      - JNJ
      - KO

    # US regular session is 09:30-16:00 ET = 13:30-20:00 UTC (14:30-21:00 EDT).
    # Deliberately skips the first 30 minutes of the open, the noisiest period.
    sessions_utc:
      - [14, 21]

    # Operator's rule: no pre-market. After hours is fine.
    #
    # This is NOT expressible in sessions_utc above, and the reason is daylight
    # saving: those are fixed UTC hours, while the US session is defined in New
    # York time and moves an hour twice a year. [[14, 21]] is the winter window
    # applied all year, so through the winter it opens at 09:00 New York --
    # half an hour of pre-market, every day, silently.
    #
    # That used to cost nothing, because an out-of-hours equity order was
    # queued to the next open. It costs something now: Alpaca runs a pre-market
    # session from 04:00 ET, so an order placed into it TRADES, in a thinner
    # book than anybody chose.
    #
    # RiskGate._premarket reads the phase in New York time, so it follows
    # daylight saving with no diary entry, and it can only ever narrow what the
    # window above permits.
    refuse_premarket: true

    # Monday to Friday. Monday is 0, Sunday is 6.
    #
    # Without this the hours alone made Saturday 15:00 UTC a valid session, and
    # Alpaca queues an out-of-hours equity order to the next open rather than
    # refusing it — so a weekend proposal would have filled at Monday's open,
    # inside the half-hour the window above exists to avoid.
    #
    # Market holidays are NOT covered by this. A Thanksgiving Thursday still
    # passes. See the note in RiskGate._within_session.
    session_days_utc: [0, 1, 2, 3, 4]

  crypto:
    # Disabled until the equity core is proven on paper.
    enabled: false

    strategy: momentum

    allowed_symbols: []
    # When enabling, set e.g. [BTC/USD, ETH/USD]

    # 24/7. This is the setting that was wrong under the old global sessions
    # block, and the reason instruments are configured separately at all.
    sessions_utc:
      - [0, 24]

    # Every day, including the weekend. This is why session_days_utc has no
    # default: Monday-to-Friday would be a sane-looking default that silently
    # shuts crypto for two days a week.
    session_days_utc: [0, 1, 2, 3, 4, 5, 6]

    # Ceiling on crypto's share of equity. It trades continuously and moves
    # harder than the equity book, so it gets a cap the equity side does not.
    capital_cap_pct: 15.0

  # ---------------------------------------------------------------------------
  # A worked CME Globex template — futures, crude, gold. NOT ENABLED, and it
  # cannot be: Alpaca offers equities, options and crypto, and nothing on
  # Globex. Trading any of this needs a second broker behind the same `Broker`
  # protocol in src/bot/broker.py. It is written out because the session shape
  # is the part that is easy to get wrong, and getting it wrong means the gate
  # approving into a shut market for the broker to queue into the next open.
  #
  # Globex runs Sunday 17:00 CT to Friday 16:00 CT with a 60-minute maintenance
  # break each day at 16:00-17:00 CT. In UTC during US daylight time (CDT,
  # UTC-5) that is:
  #
  #   Sunday     22:00 -> 24:00        opens in the evening only
  #   Mon-Thu    00:00 -> 21:00 and 22:00 -> 24:00   with the daily break
  #   Friday     00:00 -> 21:00        closes at 16:00 CT, no reopen
  #   Saturday   closed, so it is simply absent below
  #
  # The per-day mapping is what makes this expressible. The flat list form used
  # above applies one window to every trading day, which would give Sunday
  # Monday's hours and declare the market open all Sunday morning.
  #
  # **WARNING: these are UTC and Globex is defined in Central Time, so every
  # boundary here moves by an hour when US daylight saving starts and ends.**
  # Under CST (UTC-6) Sunday opens at 23:00 UTC and the break is 22:00-23:00.
  # Nothing in the code can detect that. It is a diary entry, twice a year.
  #
  # session_days_utc is deliberately omitted: with a mapping the keys are the
  # authority, and two places naming the trading days is two places to disagree.
  #
  # futures:
  #   enabled: false
  #   strategy: trend_break
  #   allowed_symbols: []          # e.g. [ES, CL, GC]
  #   sessions_utc:
  #     0: [[0, 21], [22, 24]]     # Monday
  #     1: [[0, 21], [22, 24]]     # Tuesday
  #     2: [[0, 21], [22, 24]]     # Wednesday
  #     3: [[0, 21], [22, 24]]     # Thursday
  #     4: [[0, 21]]               # Friday, closes 16:00 CT
  #     6: [[22, 24]]              # Sunday, evening open
  #   capital_cap_pct: 10.0

# ---------------------------------------------------------------------------
# Ticker tape. DISPLAY ONLY.
#
# These are the symbols that scroll across the top of the dashboard. They are
# deliberately NOT `instruments.*.allowed_symbols`, and that separation is the
# point rather than an oversight.
#
# `allowed_symbols` is a PERMISSION: `RiskGate._symbol_allowed` refuses anything
# not on it, so every name added there is a new instrument the bot may open a
# position in. This list is a VIEW. Adding a name here changes what an operator
# sees and nothing about what may be traded, which is what makes it safe to keep
# long.
#
# A symbol on the tape that is not in an enabled instrument class is marked as
# watch-only on the page, so the two lists cannot be confused by looking at it.
watchlist:
  enabled: true

  # The six tradeable names first, then what moves them. Starting from
  # `allowed_symbols` is deliberate: the tape should lead with what the bot
  # can actually act on, and the rest is context. Fifteen is long enough to
  # be worth scrolling and short enough that one refresh is sixteen quotes
  # rather than a rate-limit problem.
  #
  # SIXTEEN rather than fifteen, and the number is load-bearing: the tape
  # interleaves one clock per four instruments, so four clocks want a
  # multiple of four. A remainder would leave one clock trailing a short
  # group and the repeat would visibly limp.
  symbols:
    - SPY      # tradeable
    - QQQ      # tradeable
    - AAPL     # tradeable
    - MSFT     # tradeable
    - JNJ      # tradeable
    - KO       # tradeable
    - NVDA
    - AMZN
    - GOOGL
    - META
    - TSLA
    - AMD
    - IWM
    - BTC/USD  # crypto is a disabled instrument class, so this is
               # watch-only — which is exactly the case the tape's
               # tradeable marker exists to make visible.
    - TLT
    - GLD

  # Its own cadence, deliberately slower than the five-second account poll.
  # Fifteen quotes every five seconds is 180 requests a minute against a
  # per-minute limit; once a minute is nowhere near it. A tape is orientation,
  # not a figure anyone trades off, so a minute-old price is fine and a
  # rate-limit stall on the account read would not be.
  refresh_seconds: 60.0
