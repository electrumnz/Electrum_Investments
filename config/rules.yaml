# Trading rules — the bot CANNOT violate these. Claude proposes, risk.py gates.
#
# Every number here is enforced in deterministic Python, not by asking the model
# nicely. If you want different behaviour, change it here — do not try to talk
# the agent into it, because it cannot comply.
#
# Structure must stay the same so src/bot/config.py can parse it; the numbers
# are yours to tune.

account:
  # If equity drops below this, the bot halts entirely.
  # Set for Alpaca's default $100,000 paper balance — a 10% drawdown floor.
  # If you reset the paper account to a different balance, change this to match.
  min_equity_floor_usd: 90000

  # --- The two that matter -------------------------------------------------
  # Both are RISK limits: what would actually be lost if stops fill. That makes
  # them leverage-neutral — the same numbers mean the same thing on cash
  # equities, on margin, on options, or on futures if a broker is ever added.

  # Max loss on a single trade, as % of equity. A wider stop means a SMALLER
  # position, not more risk.
  max_risk_per_trade_pct: 1.0

  # Max combined loss if every open stop filled at once, as % of equity.
  # At 1% per trade this allows two full-size trades, or four half-size ones.
  max_total_risk_pct: 2.0

  # --- Sanity checks, not the binding constraint ---------------------------

  # Concentration cap on a single position's market value, as % of equity.
  # Deliberately generous: a 1%-risk trade with a 2% stop implies a position
  # worth ~50% of equity, so a tight cap here would silently become the real
  # limit and quietly override the risk rules above.
  max_position_pct: 50.0

  # Max simultaneous open positions across all symbols.
  max_concurrent_positions: 3

  # Daily loss kill-switch: once the day is down this much from starting equity,
  # no new positions open until the next session. Sticky — a recovery within the
  # same day does not re-enable trading.
  daily_loss_kill_pct: 3.0

# Anti-churn limits. Fees, not stock picking, were the dominant loss driver in
# the Alpha Arena LLM trading competition — the model that made 238 trades lost
# 57% of its stake. Treat these as risk controls.
frequency:
  max_trades_per_day: 5
  max_trades_per_week: 15
  # Cooldown before re-trading the same symbol. Prevents flip-flopping.
  min_seconds_between_trades_per_symbol: 1800   # 30 minutes

# Consecutive-loss circuit breaker. A losing run is when discipline is weakest
# and sizing gets worst, so this interrupts the loop rather than trying to
# predict the next trade.
#
# During a stand-down: LIVE trading is suspended, PAPER trading continues
# exactly as normal. The money stops, the practice does not — staying in the
# market on paper is the point. Closing positions and moving stops are never
# blocked, in any mode.
stand_down:
  # Losses in a row before the breaker trips.
  consecutive_losses_trigger: 3

  # A loss smaller than this many R is a scratch: it neither counts toward the
  # streak nor resets it. Without this, cutting a trade for a few dollars would
  # count against you, which would push the bot toward holding losers.
  loss_threshold_r: 0.25

  # First trip.
  stage_one_days: 3

  # A second trip inside repeat_window_days looks like a pattern rather than
  # variance, so it costs more.
  stage_two_days: 10
  repeat_window_days: 30

# Margin guards.
#
# These replace the Pattern Day Trader rule, which FINRA RETIRED on 2026-06-04
# (Regulatory Notice 26-10). The $25,000 threshold is gone: 4x intraday buying
# power now needs only $2,000 equity, and Alpaca removed daytrade_count and
# pattern_day_trader from its API on 2026-07-06.
#
# What replaced it is Intraday Margin Deficit calls — Alpaca rejects orders that
# would create a deficit in real time, and repeated non-compliance inside five
# business days still costs a 90-day account restriction. So the reasoning is
# unchanged, just pointed at the rule that actually applies now: leave headroom,
# because finding the edge is far more expensive than skipping a trade.
margin:
  # Share of available buying power a single order may consume.
  max_buying_power_utilisation_pct: 50.0

  # Total market exposure as % of equity. Reg T permits 200% overnight
  # (2:1 leverage); this leaves headroom against it.
  max_gross_notional_pct: 150.0

# Option expiry safety.
#
# The bot does not propose option trades — that is deferred work. These rules
# exist to make sure a contract never expires unnoticed, because Alpaca acts
# automatically and irreversibly at expiry:
#
#   - in the money by $0.01 or more  -> AUTO-EXERCISED by 6pm ET on expiry day
#   - ITM but you cannot fund it     -> LIQUIDATED inside the final hour
#   - short and ITM                  -> AUTO-ASSIGNED after the close
#   - "Do Not Exercise"              -> CANNOT be filed through the API
#
# Because DNE is not automatable, closing the position yourself is the only way
# to choose a different outcome. Hence warning early and loudly.
options:
  # Start warning this many days out — enough time to plan an exit.
  warn_days_before_expiry: 7.0

  # Refuse to OPEN an option position closer than this to expiry.
  min_days_to_expiry_for_entry: 3.0

  # Inside this many days, warnings are marked as requiring action.
  escalate_to_action_days: 1.0

# Don't open new positions in the N minutes around high-impact news.
# Applies across every instrument class.
news_blackout_minutes_before: 15
news_blackout_minutes_after: 15

# Accounts whose posts move prices before the wire story lands.
#
# CONTEXT ONLY. These reach Claude's prompt and nothing else; the risk gate
# never sees them. A blackout window after a high-impact post would be a change
# to what the gate refuses, and that belongs in its own commit with a test.
#
# Reading timelines needs a paid X tier and X_BEARER_TOKEN in .env. Without the
# token this block is inert, whatever it says here.
# ---------------------------------------------------------------- research
#
# Where the dreamer's researcher looks when it needs a source for a hop.
#
# **Keyless by construction, because the alternative costs money the operator
# has not chosen to spend.** Hermes' own `web` toolset needs a Nous Portal
# subscription and resolves to nothing without one — measured on this droplet,
# 17 Aug 2026 — so `lookup.py` reads these directly instead. SEC EDGAR and
# Wikipedia are not listed here: neither needs configuring and neither has an
# alternative worth choosing between.
#
# What this CANNOT do is open-web search. RSS covers the outlets named below
# and only their recent items, so a claim nobody here published stays
# unsourced and its hop stays unchecked. That is the honest state and the
# researcher says so on every empty answer.
#
# Feeds are read at most once every fifteen minutes and only when the dreamer
# runs, which is once a day. Adding more costs a fetch each; keeping the list
# broad rather than deep is the point, since the dreamer's subjects range
# further than any one outlet.
research:
  feeds:
    # Outlets whose ARTICLE PAGES can actually be read. The feed listing an
    # item is not enough — a citation needs a sentence out of the page, and a
    # paywall returns 403 to the fetch that would get one.
    #
    # Measured 17 Aug 2026: the NYT and WSJ feeds list fine and their articles
    # answer 403 and 401. They were dropped rather than left in, because a
    # feed that always fails costs a round trip per question and fills the log
    # with warnings that mean nothing is wrong.
    - https://feeds.bbci.co.uk/news/business/rss.xml
    - https://feeds.bbci.co.uk/news/technology/rss.xml
    - https://www.aljazeera.com/xml/rss/all.xml
    - https://moxie.foxbusiness.com/google-publisher/markets.xml
    - https://www.cnbc.com/id/10001147/device/rss/rss.html

social:
  enabled: false

  accounts:
    - realDonaldTrump    # tariffs, named companies, Fed commentary
    - federalreserve
    - SecScottBessent

  # How far back to look each cycle. Longer than one cycle so a post is not
  # missed when the loop restarts or a cycle runs long.
  lookback_minutes: 90

  # One line each in the prompt. More than this and a busy account crowds out
  # the market data it is meant to be read beside.
  max_posts: 12

# Instruments. Each asset class carries its own session window, symbol list and
# strategy, because they genuinely differ: equities trade a fixed window, crypto
# trades continuously. Holding both under one global session setting meant
# enabling crypto silently forbade trading it for three quarters of the day.
#
# Account-level rules above (1% per trade, 2% total risk, stand-down, daily loss,
# margin) stay portfolio-wide and apply across every class.
# How the loop spends its time and money. NOT risk rules: nothing here reaches
# the risk gate, and the worst a wrong value can do is stop the model being
# asked. It can never widen what the model is allowed to answer.
loop:

  # Skip the model call on a cycle where no enabled instrument class is in
  # session. Reconcile, the stand-down state and the option expiry alerts still
  # run every single cycle — only the proposal is skipped.
  #
  # The loop wakes 96 times a day. US equities are open for 32.5 hours of the
  # 168 in a week, so with equities alone about 80% of those cycles pay for a
  # decision that the session gate will refuse whatever it says. Observed: a
  # Sunday-night AAPL proposal, rejected on the day rule, having cost a full
  # call to produce.
  #
  # The window is DERIVED from the instruments block below, never a copy of it.
  # Enabling a 24/7 class makes this a no-op on its own, because that class is
  # always in session — so this cannot silently switch the bot off when the
  # instrument mix grows.
  skip_model_call_when_all_markets_closed: true

instruments:

  us_equity:
    enabled: true

    # Label recorded on every trade so metrics can tell strategies apart, and
    # injected into Claude's system prompt. Defining what it actually means is
    # the operator's job and is the genuinely hard part.
    strategy: mean_reversion

    # ---------------------------------------------------------------------
    # WHAT THE BOT MAY OPEN A POSITION IN. This is a PERMISSION, not a view.
    #
    # Widened from six names to twenty on the operator's decision: *"16 symbols
    # was just for the ticker tape, 16 favourite symbols, we can open the
    # approved instruments up way more than that."* It is a deliberate edit to
    # a permission and belongs in a commit of its own, never as a side effect of
    # a display change — and it is deliberately NOT the tape's list. See the
    # rule below and the `watchlist:` block at the foot of this file.
    #
    # WHAT IT COSTS, because the cost is linear and somebody has to say the
    # number. The loop runs ONE network call per symbol per feed per cycle:
    # `fetch_market_ticks` on every cycle, `fetch_indicators` and
    # `fetch_intraday` on the cycles that ask the model. Measured, on the
    # 15-minute interval and this class's 16-hour weekday window:
    #
    #   quotes    20 x 96 = 1,920 calls a day, every day
    #   bars      2 x 20 x 64 = 2,560 calls a weekday, none at the weekend
    #   prompt    ~222 input tokens per symbol per call, measured by rendering
    #             `build_market_context` over 1..24 synthetic symbols
    #
    # So the fourteen extra names cost roughly 3,100 extra input tokens on each
    # of ~64 model calls a weekday. Marketaux and Finnhub do NOT scale with
    # this — both send the symbol list as one query parameter — but the ten
    # headlines Marketaux returns now cover twenty names instead of six, so
    # per-symbol news coverage genuinely thins. That is a real cost, not a
    # rounding error, and it is the reason this list is not fifty.
    #
    # THE RULE A NAME HAS TO MEET, which is the durable half of this block:
    #
    #   1. It is a bare US ticker, so `models.class_key_for_symbol` files it
    #      under `us_equity` — the same rule `AlpacaBroker.place_order` routes
    #      on. A symbol listed under a class it cannot belong to is the audited
    #      bypass in `grants.py` arriving through the config file instead, so
    #      `tests/test_config.py` fails the build if any entry here disagrees
    #      with its own block. A test rather than a load-time refusal: refusing
    #      to start denies at the least useful moment.
    #   2. Deep, continuous liquidity. Alpaca's free feed is an IEX sample
    #      rather than consolidated tape, so a thin name gives a thin sample and
    #      the spread becomes the trade.
    #   3. At least 200 sessions of history, or `sma_200` renders `unavailable`
    #      and half the indicator block is missing on every cycle.
    #   4. NO STRUCTURAL DECAY. This class trades `mean_reversion`, and a
    #      volatility ETF rolling down the futures curve or a commodity fund
    #      bleeding in contango is not cheap because it overshot — it is cheap
    #      because that is what it does. VIXY and USO are on the tape for
    #      exactly that reason and are deliberately absent here.
    #   5. The LIQUID CORE only. Thematic, single-supplier and second-order
    #      names are the dream vault's route: an adopted dream grants one symbol,
    #      with a chain that argued for it and a clock that withdraws it. Adding
    #      such a name here would be adoption with no argument and no expiry,
    #      which is the interaction item 9 in TODO.md asks to be decided rather
    #      than stumbled into. Decided: the static list is the liquid core, and
    #      adoption stays the only way to reach outside it.
    #
    # Broad index and sector ETFs. ETFs are the same asset class as equities at
    # Alpaca, so they need no separate entry.
    allowed_symbols:
      - SPY        # S&P 500
      - QQQ        # Nasdaq 100
      - IWM        # small caps: leads the others at turns
      - DIA        # Dow 30
      - GLD        # gold, physically backed — no roll, unlike USO
      - TLT        # 20-year Treasuries: the other side of a risk-off day
      - EEM        # emerging markets
      - XLE        # energy sector
      # Mega-cap US equities, heavily covered and continuously quoted.
      - AAPL
      - MSFT
      - NVDA
      - AMZN
      - GOOGL
      - META
      - JPM
      - XOM
      - UNH
      - JNJ
      - KO
      - PG

    # US regular session is 09:30-16:00 ET = 13:30-20:00 UTC (14:30-21:00 EDT).
    # Deliberately skips the first 30 minutes of the open, the noisiest period.
    sessions_utc:
      - [8, 24]

    # Operator's decision: pre-market AND after-hours are both acceptable. If
    # the agent wants to trade them, it may.
    #
    # 08:00-24:00 UTC is 04:00-20:00 New York in summer, which is Alpaca's
    # whole tradeable day: pre-market from 04:00, the regular session, and
    # after-hours to 20:00. In winter it shifts an hour and covers 03:00-19:00
    # ET instead, so the last hour of after-hours falls outside. That is the
    # daylight-saving problem described below, and it now costs an hour at the
    # END of the day rather than admitting pre-market at the start.
    #
    # **An order placed outside the regular session does not fill there.**
    # `place_order` sends a bracket or an OTO, and Alpaca does not accept
    # either with `extended_hours`, so an out-of-hours order RESTS and becomes
    # eligible at the next open. That is deliberate rather than a limitation
    # to route around: it is what keeps the stop at the broker. Trading the
    # thin book instead would mean a plain limit order and no broker-side stop.
    #
    # So what widening this buys is the ability to PLACE at any hour, with the
    # fill arriving at the open. The old note follows, because the
    # daylight-saving trap it describes is still real.
    #
    # This is NOT expressible in sessions_utc above, and the reason is daylight
    # saving: those are fixed UTC hours, while the US session is defined in New
    # York time and moves an hour twice a year. [[14, 21]] is the winter window
    # applied all year, so through the winter it opens at 09:00 New York --
    # half an hour of pre-market, every day, silently.
    #
    # That used to cost nothing, because an out-of-hours equity order was
    # queued to the next open. It costs something now: Alpaca runs a pre-market
    # session from 04:00 ET, so an order placed into it TRADES, in a thinner
    # book than anybody chose.
    #
    # RiskGate._premarket reads the phase in New York time, so it follows
    # daylight saving with no diary entry, and it can only ever narrow what the
    # window above permits.
    refuse_premarket: false

    # ---------------------------------------------------------------------
    # OFF. This is the switch that trades away one of the operator's four
    # rules, and it is the most deliberate one in this file.
    #
    # WHAT IT BUYS: an entry submitted during the pre-market (04:00-09:30 New
    # York) or after hours (16:00-20:00) that actually FILLS THERE, rather
    # than resting until the next regular open. That is the fork nobody was
    # offered when 21 SPY went in at 09:23:47 New York, came back
    # filled_qty=0.0, sat through the pre-market and filled after 09:30 --
    # correct behaviour, correct explanation, and the answer to the other
    # question. "Place the trade now" and "get a position on now" are
    # different instructions and the code can satisfy exactly one.
    #
    # WHAT IS SURRENDERED, stated as a consequence rather than a mechanism:
    #
    #   The position stands at the broker with NOTHING RESTING BEHIND IT.
    #   Rule 3 -- hard stops on every trade -- stays true at sizing time and
    #   stops being true at the broker. The stop becomes a journal figure and
    #   stop_watch REPORTS a breach on the loop's fifteen-minute pulse; it
    #   never closes, because closing out of hours is a new execution path
    #   and one that fires unattended at 3am is its own decision.
    #
    # WHY THERE IS NO THIRD OPTION: place_order attaches the stop, which makes
    # every entry a bracket or an OTO, and Alpaca accepts extended_hours on
    # neither. An entry that carries a stop cannot fill out of hours; an entry
    # that can fill out of hours carries no stop.
    #
    # WHAT IS SURRENDERED IS NARROWER THAN IT LOOKS, and the honest version
    # matters here more than the alarming one. A resting stop could not have
    # fired out of hours ANYWAY: a stop is a trigger that becomes a MARKET
    # order, and extended-hours venues take limit orders only. So what is
    # actually given up is the leg being THERE when the regular session
    # reopens, and the window between the fill and that reopening in which
    # nothing is resting at the broker. On a short horizon that is less than
    # it sounds; held overnight it is exactly rule 3 missing.
    #
    # THIS IS NOT NEW GROUND. Crypto already lives here -- Alpaca accepts no
    # bracket on it either -- so this is a new trigger for an arrangement that
    # already exists, not a new concept. Same watcher, same reporting.
    #
    # TURNING IT ON TAKES TWO THINGS, on purpose. This flag, and the broker
    # being constructed with the rules (`AlpacaBroker(env, rules)`); without
    # the second, no class can be consulted and the path is unreachable
    # whatever this says. Even then it engages only in the pre-market and
    # after hours, never overnight or at the weekend, where it would give up
    # the stop and buy no fill at all.
    #
    # HOW TO TELL AFTERWARDS: the OrderResult comes back
    # stop_at_broker=ABSENT, a warning line reads
    # `extended_hours_fill_no_broker_stop`, and Rules.extended_hours_fill_classes
    # names every class in this state.
    allow_extended_hours_fills: false

    # Monday to Friday. Monday is 0, Sunday is 6.
    #
    # Without this the hours alone made Saturday 15:00 UTC a valid session, and
    # Alpaca queues an out-of-hours equity order to the next open rather than
    # refusing it — so a weekend proposal would have filled at Monday's open,
    # inside the half-hour the window above exists to avoid.
    #
    # Market holidays are NOT covered by this. A Thanksgiving Thursday still
    # passes. See the note in RiskGate._within_session.
    session_days_utc: [0, 1, 2, 3, 4]

    # This class's own limits. Set to the portfolio values rather than left
    # out, so the equity book states what it is working to instead of leaving
    # a reader to go and find `account:` and assume nothing overrides it.
    #
    # A value here OVERRIDES the portfolio one for this class, in either
    # direction: `account:` is the default, not a ceiling. Nothing refuses a
    # looser value. Arguing the case for one is the settings agent's job — it
    # pushes back and makes the operator think, without denying the change.
    max_risk_per_trade_pct: 1.0
    max_position_pct: 50.0
    max_concurrent_positions: 3

  crypto:
    # OFF, and the settings page shows it as off rather than omitting it.
    #
    # Kept fully configured while disabled on purpose. The moment to enable
    # this is a moment when nothing else is open — a weekend, or the small
    # hours — which is the worst possible moment to be deciding what a crypto
    # position should be allowed to risk. The numbers below were chosen with
    # the market shut and nothing riding on them; enabling is then a one-word
    # edit rather than a design exercise under time pressure.
    #
    # `Rules.allowed_symbols` is derived from the ENABLED classes, so while
    # this is false the gate refuses every symbol here and the tape marks them
    # watch-only. Flipping it to true is the whole change.
    enabled: false

    strategy: momentum

    allowed_symbols: []
    # When enabling, set e.g. [BTC/USD, ETH/USD]

    # Crypto's own limits, and they are TIGHTER than the equity book's at
    # every point. Not caution for its own sake — three specific differences:
    #
    #   It trades while nobody is awake. An equity stop that gaps does so at an
    #   open somebody can watch; a crypto stop can gap at 04:00 local with the
    #   operator asleep and no session boundary to stop the move.
    #
    #   It moves harder. A 2% daily range is a notable equity day and an
    #   ordinary crypto one, so the same 1% risk budget buys a position that
    #   swings several times as far before the stop is even approached.
    #
    #   There is no circuit breaker. US equities halt on a large move; there is
    #   nothing equivalent here.
    #
    # Half the per-trade risk, a third of the concentration, and one position
    # at a time.
    max_risk_per_trade_pct: 0.5
    max_position_pct: 15.0
    max_concurrent_positions: 1

    # The operator's rule, and it is TWO limits rather than one restated:
    # crypto shall not consume more than 0.5% of equity in risk on a trade
    # (above), and shall not HOLD more than 0.5% of risk across every open
    # position in the class (here). The second is what stops the first being
    # applied four times over.
    #
    # Two clauses are easy to lose and are the whole point:
    #
    #   UNREALISED PROFIT DOES NOT OFFSET THIS. A position that is up is still
    #   risking |entry - stop| x qty if the stop fills, so a winner buys no room
    #   for a second position. The gate measures planned risk out of the journal
    #   and never nets a paper gain against it — a mark can reverse before
    #   anything is acted on, and the stop distance cannot.
    #
    #   A POSITION MUST BE CLOSED TO OPEN ANOTHER outside the profile. At the
    #   cap the gate refuses, and closing what is already on is the only way
    #   through. It will not size the new trade down to fit, and it will not
    #   count a profitable position for less. The rejection message says this
    #   out loud rather than quoting a number and leaving somebody hunting for
    #   a limit to widen.
    #
    # With the per-trade cap also at 0.5% this makes crypto ONE full-size
    # position at a time. That is intended rather than an accident of the two
    # figures matching: it is max_concurrent_positions: 1 arrived at from the
    # other direction, so the two agree instead of one silently overriding the
    # other. Two half-size crypto positions are allowed by this arithmetic and
    # refused by the position count; one full-size position is allowed by both.
    # Loosening either one alone therefore changes nothing.
    #
    # Nothing global is overridden: max_total_risk_pct (2%) stays portfolio-wide
    # and binds first whenever the equity book is already loaded up.
    max_class_total_risk_pct: 0.5

    # Deliberately absent: refuse_premarket. A 24/7 market has no pre-market,
    # and the phases that rule reads are the US equity ones — switched on here
    # it would refuse every hour of every day.
    #
    # Deliberately absent for the mirror-image reason: allow_extended_hours_fills.
    # A continuous market has no extended hours to fill in, and crypto is
    # already unbracketed at Alpaca, so there is nothing here to surrender and
    # nothing to buy. `broker.plan_extended_hours_fill` refuses a crypto symbol
    # outright, so setting it here would change nothing — and it says so on the
    # log line rather than ignoring it silently.

    # 24/7. This is the setting that was wrong under the old global sessions
    # block, and the reason instruments are configured separately at all.
    sessions_utc:
      - [0, 24]

    # Every day, including the weekend. This is why session_days_utc has no
    # default: Monday-to-Friday would be a sane-looking default that silently
    # shuts crypto for two days a week.
    session_days_utc: [0, 1, 2, 3, 4, 5, 6]

    # Ceiling on crypto's share of equity. It trades continuously and moves
    # harder than the equity book, so it gets a cap the equity side does not.
    capital_cap_pct: 15.0

  # ---------------------------------------------------------------------------
  # A worked CME Globex template — futures, crude, gold. NOT ENABLED, and it
  # cannot be: Alpaca offers equities, options and crypto, and nothing on
  # Globex. Trading any of this needs a second broker behind the same `Broker`
  # protocol in src/bot/broker.py. It is written out because the session shape
  # is the part that is easy to get wrong, and getting it wrong means the gate
  # approving into a shut market for the broker to queue into the next open.
  #
  # Globex runs Sunday 17:00 CT to Friday 16:00 CT with a 60-minute maintenance
  # break each day at 16:00-17:00 CT. In UTC during US daylight time (CDT,
  # UTC-5) that is:
  #
  #   Sunday     22:00 -> 24:00        opens in the evening only
  #   Mon-Thu    00:00 -> 21:00 and 22:00 -> 24:00   with the daily break
  #   Friday     00:00 -> 21:00        closes at 16:00 CT, no reopen
  #   Saturday   closed, so it is simply absent below
  #
  # The per-day mapping is what makes this expressible. The flat list form used
  # above applies one window to every trading day, which would give Sunday
  # Monday's hours and declare the market open all Sunday morning.
  #
  # **WARNING: these are UTC and Globex is defined in Central Time, so every
  # boundary here moves by an hour when US daylight saving starts and ends.**
  # Under CST (UTC-6) Sunday opens at 23:00 UTC and the break is 22:00-23:00.
  # Nothing in the code can detect that. It is a diary entry, twice a year.
  #
  # session_days_utc is deliberately omitted: with a mapping the keys are the
  # authority, and two places naming the trading days is two places to disagree.
  #
  # futures:
  #   enabled: false
  #   strategy: trend_break
  #   allowed_symbols: []          # e.g. [ES, CL, GC]
  #   sessions_utc:
  #     0: [[0, 21], [22, 24]]     # Monday
  #     1: [[0, 21], [22, 24]]     # Tuesday
  #     2: [[0, 21], [22, 24]]     # Wednesday
  #     3: [[0, 21], [22, 24]]     # Thursday
  #     4: [[0, 21]]               # Friday, closes 16:00 CT
  #     6: [[22, 24]]              # Sunday, evening open
  #   capital_cap_pct: 10.0

# ---------------------------------------------------------------------------
# Ticker tape. DISPLAY ONLY.
#
# These are the symbols that scroll across the top of the dashboard. They are
# deliberately NOT `instruments.*.allowed_symbols`, and that separation is the
# point rather than an oversight.
#
# `allowed_symbols` is a PERMISSION: `RiskGate._symbol_allowed` refuses anything
# not on it, so every name added there is a new instrument the bot may open a
# position in. This list is a VIEW. Adding a name here changes what an operator
# sees and nothing about what may be traded, which is what makes it safe to keep
# long.
#
# A symbol on the tape that is not in an enabled instrument class is marked as
# watch-only on the page, so the two lists cannot be confused by looking at it.
watchlist:
  enabled: true

  # DISPLAY ONLY. Nothing here reaches the risk gate — see WatchlistRules.
  # A symbol on the tape is not tradeable unless it is ALSO in an enabled
  # instrument class, and the renderer marks the ones that are.
  #
  # Grouped by KIND, and the grouping is the whole point. Sixteen large-cap
  # US equities scroll past as sixteen of the same thing. An index beside a
  # metal beside a crypto pair beside the long bond is a picture of what is
  # moving where — and when they disagree, that disagreement is the most
  # useful thing on the strip.
  #
  # The kind is declared rather than derived. GLD is an ETF by structure and
  # gold by meaning, and only the second is worth showing; no amount of
  # ticker-parsing recovers that.
  #
  # `symbols` is DERIVED by interleaving these round-robin, so consecutive
  # cells are of different kinds. Listing them grouped would put five
  # equities in a row and then three metals, which is the monotony the kinds
  # exist to break.
  #
  # SIXTEEN in total, and the number is load-bearing: the tape interleaves one
  # clock per four instruments, so four clocks want a multiple of four. A
  # remainder leaves one clock trailing a short group and the repeat limps.
  kinds:
    index:
      - SPY        # tradeable
      - QQQ        # tradeable
      - IWM        # small caps: leads the others at turns
    equity:
      - AAPL       # tradeable
      - MSFT       # tradeable
      - NVDA
    crypto:
      # Crypto is a DISABLED instrument class, so these are watch-only —
      # exactly the case the tape's tradeable marker exists to make visible.
      # They are also the only cells that keep quoting at 3am on a Sunday.
      - BTC/USD
      - ETH/USD
    defensive:
      - JNJ        # tradeable
      - KO         # tradeable
    commodity:
      - GLD        # gold
      - USO        # crude
    rates:
      - TLT        # 20-year Treasuries: the other side of a risk-off day
    volatility:
      - VIXY       # not the VIX itself, which has no tradeable quote
    international:
      - EEM        # emerging markets
    energy:
      - XLE

  # Its own cadence, deliberately slower than the five-second account poll.
  # Fifteen quotes every five seconds is 180 requests a minute against a
  # per-minute limit; once a minute is nowhere near it. A tape is orientation,
  # not a figure anyone trades off, so a minute-old price is fine and a
  # rate-limit stall on the account read would not be.
  refresh_seconds: 60.0

# ---------------------------------------------------------------------------
# The dreamer's shelves, and the one setting in this file that can widen what
# may be traded without an edit to `instruments:` above.
#
# `allow_symbol_grants` is `false` in the MODEL and `true` here, and the
# asymmetry is deliberate rather than untidy. A config that never mentions this
# feature grants nothing — every deployment predating it, and every test that
# builds Rules without this block, fails closed. This file says `true` because
# the operator asked for the behaviour, and a decision somebody made belongs in
# a file that can be read and reverted in one line rather than in a default
# nobody sees.
#
# WHAT ADOPTION BUYS, stated plainly because it is a widening:
#
#   An adopted dream's symbols join `allowed_symbols` for as long as that
#   adoption is live. That is the whole grant. The symbol then faces every
#   other gate under the limits of the class it was granted under — session,
#   pre-market, per-trade risk, concentration, concurrency, the class total,
#   the capital cap, buying power, the cooldown. Nothing is skipped and no
#   number moves. A permission is not an order.
#
# WHAT IT CANNOT BUY, which is the part worth being strict about:
#
#   It cannot enable an instrument class. The hard block is derived from the
#   `enabled:` flags above, so while `crypto.enabled` is false a dream naming
#   BTC/USD grants NOTHING, whatever the dream says. That is what makes "crypto
#   is off" mean off rather than "off unless a dream says otherwise".
#
#   It cannot raise a limit. A granted symbol is sized by the same arithmetic
#   as a listed one, and a grant that would breach a cap is refused like any
#   other trade.
#
#   It cannot outlive the adoption. Expiry or a return to the vault revokes the
#   symbol immediately, and a trade proposed in it afterwards is refused like
#   any other unlisted symbol. An OPEN position is never force-closed by that —
#   closing sits outside the gated path on purpose — so the permission to open
#   ends while the position stands.
#
# The grant is resolved OUTSIDE the risk gate, in src/bot/grants.py, and passed
# in as a mapping. `RiskGate` reads no database and makes no network call, so it
# stays deterministic and cannot fail open; a resolution that fails for any
# reason yields NOTHING GRANTED and the account carries on trading exactly what
# this file already allows.
dreaming:

  # Turn the whole permission half off with one word. The dreamer keeps
  # dreaming; nothing it produces can widen `allowed_symbols`.
  allow_symbol_grants: true

  # Ceiling on how many symbols may be granted at once. Over it, NOTHING is
  # granted and the resolver logs loudly rather than picking a subset — an
  # arbitrary subset is a permission set nobody can predict, which is worse
  # than no permission at all.
  #
  # Twice `caps.adopted`, so three live adoptions naming two symbols each fit
  # and a runaway does not. A blast-radius bound, not a target: what actually
  # limits the cost of a grant is the class's own risk limits.
  max_granted_symbols: 6

  # How many dreams each shelf holds. Working constraints, not risk rules —
  # nothing in the dream store can lose money — and they exist because a vault
  # with two hundred entries is a vault nobody reads.
  #
  # `adopted: 3` matches `account.max_concurrent_positions` ON PURPOSE. An
  # adopted dream is a promise the trading agent may act on it, and a promise
  # the account has no slot to keep reads as permission granted while the
  # position it implies can never be opened. Change one, look at the other.
  #
  # `archive` is deliberately absent: the archive is uncapped, because the only
  # alternative to archiving a dream when the archive is full is deleting it.
  caps:
    workbench: 24
    prophecy: 12
    vault: 12
    adopted: 3

  # How long a dream may sit on a shelf before it is reported as expired, in
  # days, measured from when it ENTERED that shelf and never from when it was
  # created — a dream pulled back for another pass gets a fresh clock, because
  # the alternative punishes reworking a chain.
  #
  # The operator was explicitly unsure between ninety days and a year, which is
  # why these are here to be argued with rather than constants in the code.
  # `prophecy` gets the long one because a prophecy is a long-horizon claim by
  # nature: a supply chain does not reprice in a quarter. `archive` is absent
  # because the archive IS the retirement state, so a TTL on it would be an
  # expiry on an expiry.
  #
  # Expiry MARKS; it never deletes. For an adopted dream it does one thing
  # more, and that thing has teeth: it withdraws the symbol permission.
  ttl_days:
    workbench: 90
    prophecy: 365
    vault: 90
    adopted: 90

# Whether the LOOP may act on the position plans it writes, unattended.
#
# The operator asked for the trading agent to have control of its own open
# position — to be able to close it, or pull its stop in, and to have the reason
# recorded rather than reconstructed later. **That is satisfied with this set to
# false.** The agent acts through the MCP tools `tighten_stop` and
# `close_position_with_reason`, in a conversation, with a person present.
#
# This switch is about something else, and it is worth being blunt about which:
# the fifteen-minute decision loop closing a position or moving a stop AT 3AM
# WITH NOBODY WATCHING. That is a new unattended live execution path. Building
# the record is not the same decision as arming the trigger, and the trigger is
# the operator's to throw deliberately — in its own commit, with a reason.
#
# What it cannot do, whichever way it is set:
#
#   It cannot widen a stop. `position_actions.classify_stop_move` refuses any
#   move away from entry, on a long or a short, before this flag is consulted.
#   Widening a stop on an open position increases the loss at unchanged size,
#   and `RiskGate` never sees a position move — closing and stop moves sit
#   outside the gated path on purpose, so that a stand-down cannot strand an
#   open trade. That exemption is only safe for moves that reduce exposure, so
#   the one move that does not is refused in code rather than discouraged in a
#   prompt.
#
#   It cannot act without a reason. Every move is stored with an actor, a
#   timestamp, the before and after values and a required non-empty reason; a
#   blank one is refused at three layers. A stop or a quantity that changed at
#   the broker with no reason on file is reported as an `unexplained-move`,
#   which is what stops the record hiding its own failures.
#
#   It cannot open anything. Opening exposure is `place_order` and nothing else,
#   and that still goes through `RiskGate.evaluate` on every path.
position_actions:
  enabled: false
