# Reference library — third-party projects we study, borrow patterns from, or
# depend on.
#
# Nothing here is vendored into git. `scripts/fetch_reference.py` shallow-clones
# each repo into reference/src/ (gitignored) and records the exact commit it
# landed on in reference/versions.json, which IS committed. That file plus
# reference/STATUS.md are what make upstream drift visible in git history:
# re-run the scripts, and the diff tells you what moved since last time.
#
# All of these are permissively licensed (MIT / Apache-2.0). Licences are
# re-read from the clone at fetch time rather than trusted from this file, so if
# an upstream relicenses, STATUS.md will say so.
#
# To add a project: append an entry, run scripts/fetch_reference.py, then
# scripts/check_reference_updates.py, and commit the regenerated files.

repos:
  - name: buzz
    repo: block/buzz
    url: https://github.com/block/buzz
    ref: main
    expected_license: Apache-2.0
    why: >
      Block's open-source workspace where AI agents are first-class members with
      their own Nostr identity. This is the chat interface the bot is handed off
      through. Launched 2026-07-21 and still early (0.4.x, no mobile client), so
      pin deliberately and read release notes before bumping.

  - name: hermes-agent
    repo: NousResearch/hermes-agent
    url: https://github.com/NousResearch/hermes-agent
    ref: main
    expected_license: MIT
    why: >
      Nous Research's agent runtime — memory, skills, approval gates, cron
      delivery, MCP client support, and a documented Buzz integration. Provides
      the persistence and approval layer that a bare Claude Code session lacks.

  - name: goose
    repo: block/goose
    url: https://github.com/block/goose
    ref: main
    expected_license: Apache-2.0
    why: >
      Block's own agent framework, natively supported by Buzz alongside Claude
      Code and Codex. Worth reading for how it models extensions and tool
      permissioning even if we stay on Claude Code.

  - name: atomic-agents
    repo: BrainBlend-AI/atomic-agents
    url: https://github.com/BrainBlend-AI/atomic-agents
    ref: main
    expected_license: MIT
    why: >
      Lightweight agent framework built on Instructor and Pydantic, favouring
      explicit control flow over autonomy. Closest in philosophy to this repo's
      "model proposes, code disposes" split — useful reference for structuring
      the decision step without handing over control.

  - name: eliza
    repo: elizaOS/eliza
    url: https://github.com/elizaOS/eliza
    ref: main
    expected_license: MIT
    why: >
      The most established crypto/on-chain agent framework, with a large plugin
      ecosystem for market data, wallets and social feeds. Reference for the
      crypto sleeve and for sentiment ingestion patterns.

  - name: letta
    repo: letta-ai/letta
    url: https://github.com/letta-ai/letta
    ref: main
    expected_license: Apache-2.0
    why: >
      Agents with long-term persistent memory (formerly MemGPT). Relevant if the
      bot should genuinely learn across sessions rather than re-reading its
      audit log each time.

  - name: hyperagent
    repo: hyperbrowserai/HyperAgent
    url: https://github.com/hyperbrowserai/HyperAgent
    ref: main
    expected_license: AGPL-3.0
    why: >
      Playwright-based browser automation with MCP support. The legitimate route
      to sources that have no usable API — Truth Social in particular, and X
      without paying for the $200/mo tier.
      TWO CAVEATS, both load-bearing. (1) LICENCE: this is AGPL-3.0, the only
      copyleft project in this registry. Its network-use clause means that if you
      modify it and let anyone reach it over a network, you must publish your
      modified source. Reading it for reference is fine; importing it into this
      bot is a licensing decision, not just a technical one. Keep it in a separate
      process talking over a documented interface if you use it at all.
      (2) TERMS OF SERVICE: automated scraping breaches many sites' terms. Check
      the target's terms before pointing this anywhere, and prefer a paid API
      where one exists.

  - name: alpaca-mcp-server
    repo: alpacahq/alpaca-mcp-server
    url: https://github.com/alpacahq/alpaca-mcp-server
    ref: main
    expected_license: MIT
    why: >
      Alpaca's official MCP server — not just reference, an actual dependency.
      Exposes 80+ trading and market-data tools and defaults to paper trading.
      Restrict it with ALPACA_TOOLSETS so our own MCP server stays the only
      order-placing path.

  # --- Backtesting -------------------------------------------------------
  # docs/HANDOFF.md calls a backtest harness the highest-value thing to build
  # next: right now a strategy can only be evaluated forward, which means weeks
  # per idea. These three are the realistic options, in increasing order of
  # power and learning curve.

  - name: backtesting.py
    repo: kernc/backtesting.py
    url: https://github.com/kernc/backtesting.py
    ref: master
    expected_license: AGPL-3.0
    why: >
      The simplest credible backtester — small API, clean docs, readable source.
      Start here: a first harness that works beats a sophisticated one that never
      gets finished.
      Licence: AGPL-3.0. Its copyleft obligation triggers on conveying the software
      to others over a network, which a single-operator personal tool never does.
      Only relevant if this is ever exposed to other users.

  - name: vectorbt
    repo: polakowo/vectorbt
    url: https://github.com/polakowo/vectorbt
    ref: master
    expected_license: Apache-2.0+CommonsClause
    why: >
      Vectorised backtesting built for parameter sweeps — the fastest way to ask
      "does this signal have any edge at all?" across a large grid. Weak on
      execution realism, so treat its results as triage rather than proof.
      Licence: Apache-2.0 with the Commons Clause, which makes it source-available
      rather than open source despite being widely described as the latter. The
      clause restricts *selling* the software or a service built substantially on
      it. Personal and research use is explicitly fine, so it does not constrain
      this project.

  - name: nautilus_trader
    repo: nautechsystems/nautilus_trader
    url: https://github.com/nautechsystems/nautilus_trader
    ref: develop
    expected_license: LGPL-3.0
    why: >
      Production-grade event-driven engine with realistic fills, latency
      modelling and backtest/live parity — the same strategy code runs in both.
      Steep learning curve; the right graduation target once a strategy is worth
      testing properly. Note it defaults to the `develop` branch, not `main`.

  # --- LLM trading prior art ---------------------------------------------
  # Read these before inventing an architecture. All of them have already hit
  # the problems this project will hit.

  - name: TradingAgents
    repo: TauricResearch/TradingAgents
    url: https://github.com/TauricResearch/TradingAgents
    ref: main
    expected_license: Apache-2.0
    why: >
      The most established multi-agent LLM trading framework, modelled on the
      desk structure of a real trading firm (analysts, researchers, trader, risk
      manager) with Claude among its supported providers. The closest thing to
      prior art for what this repo is doing, and the best single source for how
      a multi-agent version would be shaped.

  - name: ai-hedge-fund
    repo: virattt/ai-hedge-fund
    url: https://github.com/virattt/ai-hedge-fund
    ref: main
    expected_license: MIT
    why: >
      Runs a panel of investor personas that argue a position before it is taken.
      A genuinely different architecture from a single proposing model, and the
      adversarial framing is a plausible answer to the Alpha Arena finding that
      lone models are confidently wrong at a 25-30% win rate.

  - name: FinRL
    repo: AI4Finance-Foundation/FinRL
    url: https://github.com/AI4Finance-Foundation/FinRL
    ref: master
    expected_license: MIT
    why: >
      Reinforcement learning for trading, with a documented path from research
      notebooks through to live Alpaca execution — the same broker this bot uses,
      so its execution layer is directly readable. Also a useful counterweight:
      RL optimises a stated objective, which forces you to say what "good" means
      instead of leaving it to a model's judgement.
