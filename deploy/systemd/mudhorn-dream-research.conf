# Drop-in for mudhorn-dream.service. Installed by deploy/enable-research.sh.
#
#   /etc/systemd/system/mudhorn-dream.service.d/research.conf
#
# ## What this is, and why it is a drop-in rather than an edit
#
# `mudhorn-dream.service` is sandboxed harder than the units that touch a
# broker, on the honest grounds that it places nothing. Three of those settings
# block `sudo`:
#
#   - NoNewPrivileges=true  — refuses the privilege gain outright. `sudo` is
#                             setuid, so this is a total block.
#   - RestrictSUIDSGID=true — systemd makes this IMPLY NoNewPrivileges, so it
#                             blocks sudo even where the first is absent. This
#                             is the one people miss.
#   - ProtectHome=true      — /home is empty in the unit's mount namespace, and
#                             `run-research.sh` does `cd "$HERMES_HOME"`.
#                             Sandboxing is a mount namespace and every
#                             descendant inherits it; sudo does not escape one.
#
# So the researcher CANNOT run from the dream timer with the unit as shipped.
# It fails safe rather than silently — `Researcher.enabled` asks `sudo -n -l`,
# gets a refusal, and every answer carries an error saying no researcher is
# permitted — but the feature is inert until this drop-in is installed.
#
# A drop-in and not an edit, for the reason `mudhorn-bot-execute.conf` is one:
# `bootstrap.sh` rewrites the unit files, so an edit is undone by the next
# deploy. Loosening a sandbox has to be a deliberate act that survives one.
#
# ## What it costs, stated plainly
#
# It is the same trade `mudhorn-web.service` already makes for the chat panel,
# and the same three things keep it bounded:
#
#   - The sudoers rule names `deploy/run-research.sh`, a root-owned wrapper
#     with NO arguments — never the Hermes binary, which would accept `--yolo`
#     and every flag a future release adds.
#   - The question travels on STDIN, so nothing in a dream's text can be read
#     as a flag.
#   - The sudo runs DOWNWARD, mudhorn → hermes, into a home with no
#     `mcp_servers` block at all. No broker, no journal, no dream store. The
#     wrapper greps its own config and refuses to start if one appears — and
#     refuses equally when the config cannot be READ, because "I could not
#     establish that this instance is isolated" and "this instance is isolated"
#     are different answers.
#
# What is genuinely given up is that this unit is UNATTENDED — it fires at
# 07:00 Pacific/Auckland with nobody watching, where the chat panel's sudo runs
# because a signed-in operator pressed a key. That is the real difference from
# the web unit's version of this trade, and it is why the researcher's config
# is an ALLOWLIST rather than a denylist: a denylist admits whatever the next
# Hermes release adds, and here that would be a web-reading process gaining a
# capability nobody chose, on a timer, at 3am.
#
# Everything else in the unit is left exactly as it was. ProtectSystem=strict,
# PrivateTmp, the kernel protections and the address-family restriction all
# still apply, and they are not listed here at all — a drop-in only overrides
# what it names.

[Service]
NoNewPrivileges=false
RestrictSUIDSGID=false
ProtectHome=false
