# Drop-in that turns on order placement. NOT installed by bootstrap.sh.
#
#     sudo mkdir -p /etc/systemd/system/mudhorn-bot.service.d
#     sudo cp /opt/mudhorn/deploy/systemd/mudhorn-bot-execute.conf \
#             /etc/systemd/system/mudhorn-bot.service.d/execute.conf
#     sudo systemctl daemon-reload
#     sudo systemctl restart mudhorn-bot
#
# To turn it off again, delete that file and repeat the last two commands. The
# unit itself is never edited, so a `git pull` cannot quietly re-enable or
# re-disable execution, and `systemctl cat mudhorn-bot` always shows which of
# the two states the box is in.
#
# The empty ExecStart= is required and is not a typo. ExecStart is an additive
# key in a drop-in, and a second one without the reset makes systemd refuse to
# start the unit ("more than one ExecStart"). Clearing the list first is the
# documented way to replace it.
#
# ## What this actually changes
#
# Only whether an APPROVED proposal is sent to the broker. Everything upstream
# is identical: the same context, the same model call, the same
# `RiskGate.evaluate` against the same `config/rules.yaml`, the same audit
# entry. A proposal the gate rejects is rejected either way. So this does not
# widen any limit, and it must never be used as a way to make one fit.
#
# ## What it does not protect you from
#
# `ALPACA_PAPER_TRADE=false` is refused by the code in two places, so this
# cannot reach a live account. What it can do is make the paper account behave
# like a real one, which is the point: fills, partial fills, slippage against
# the quote, resting stop orders, and a journal that finally has trades in it
# for the Analytics page to measure. Expect the first days to be mostly
# instructive rather than profitable — Alpha Arena's lesson was that trade
# frequency is a risk parameter, and the loop wakes 96 times a day.
#
# Watch `journalctl -u mudhorn-bot -f` for `executed` in the cycle line, and
# the Decisions page for anything the gate refused and why.

[Service]
ExecStart=
ExecStart=/opt/mudhorn/.venv/bin/electrum-bot loop --execute
