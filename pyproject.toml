[project]
name = "electrum-bot"
version = "0.1.0"
description = "AI trading bot for Alpaca paper trading, with a deterministic risk gate"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "alpaca-py>=0.33",
    "mcp>=1.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "httpx",
]

[project.scripts]
electrum-bot = "bot.main:main"
electrum-bot-mcp = "bot.mcp_server:main"
electrum-bot-web = "bot.web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
# deploy/ holds one Python script, and it runs as root against the Hermes
# config. A script nobody type-checks because it lives outside src/ is exactly
# the kind of thing that fails on the box rather than in CI.
files = ["src", "tests", "deploy"]

[[tool.mypy.overrides]]
module = ["alpaca.*", "mcp.*", "uvicorn.*"]
ignore_missing_imports = true

# Tests stay readable without `-> None` on every function. The production code
# under src/ remains fully strict.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
