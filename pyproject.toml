[project]
name = "electrum-bot"
version = "0.1.0"
description = "AI trading bot for Alpaca paper trading, with a deterministic risk gate"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "alpaca-py>=0.33",
    "mcp>=1.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Public-holiday rules for TSE, ASX and NZX, so the tape's exchange badges stop
# rendering Boxing Day as an open ASX. OPTIONAL on purpose: this is a package on
# the box that runs the trading loop, added to colour a badge for three markets
# the bot does not trade, and `src/bot/exchange_hours.py` degrades to the old
# weekday-shaped behaviour without it — `ClockFace.tracks_holidays` goes False
# again and the badge's own tooltip says holidays are not tracked.
#
# It brings korean_lunar_calendar, pyluach, toolz and tzdata with it and needs
# pandas, which alpaca-py already requires — so the marginal cost measured on
# this venv is about 6 MB, not the 150 MB pandas and numpy would suggest.
#
# `deploy/bootstrap.sh` installs `-e .` and therefore does NOT pick this up. The
# droplet keeps today's behaviour until that line becomes `-e ".[calendars]"`.
calendars = [
    "exchange_calendars>=4.5",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "httpx",
    # So CI exercises the path where the rules ARE present. The absent path is
    # exercised too, by a test that fails the import at the same boundary the
    # real one would — both halves have to be checked, and a green suite that
    # only ever saw one of them would be the weaker claim.
    "exchange_calendars>=4.5",
]

[project.scripts]
electrum-bot = "bot.main:main"
electrum-bot-mcp = "bot.mcp_server:main"
electrum-bot-console = "bot.console_mcp:main"
electrum-bot-web = "bot.web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
# deploy/ holds one Python script, and it runs as root against the Hermes
# config. A script nobody type-checks because it lives outside src/ is exactly
# the kind of thing that fails on the box rather than in CI.
files = ["src", "tests", "deploy", "scripts"]

[[tool.mypy.overrides]]
# `exchange_calendars` ships no stubs, and it is an OPTIONAL dependency — so on
# a checkout without it the import must type-check as missing rather than fail
# the run. `exchange_hours.py` holds it behind `Any` and converts at the
# boundary, so nothing untyped escapes into the rest of the codebase.
module = ["alpaca.*", "mcp.*", "uvicorn.*", "exchange_calendars.*"]
ignore_missing_imports = true

# Tests stay readable without `-> None` on every function. The production code
# under src/ remains fully strict.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
